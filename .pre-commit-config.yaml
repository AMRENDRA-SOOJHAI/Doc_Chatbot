repos:
  # Auto-format code with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.12

  # Sort imports with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Run tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'python -m pytest test_app.py -v --tb=short 2>&1 | tail -20'
        language: system
        types: [python]
        pass_filenames: false

  # Check coverage
  - repo: local
    hooks:
      - id: coverage
        name: coverage-check
        entry: bash -c 'python -m pytest test_app.py --cov=app --cov=main --cov-report=term-missing --cov-fail-under=75 2>&1 | tail -20 || true'
        language: system
        types: [python]
        pass_filenames: false

  # Remove unused imports
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args: ["--in-place", "--remove-all-unused-imports", "--remove-unused-variables"]
