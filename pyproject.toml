[project]
name = "rag-document-chatbot-main"
version = "0.1"
description = "Built an AI chatbot using RAG pipeline that can upload and read PDF documents, retrieve the most relevant content, and generate accurate answers using an LLM."
authors = [
    {name = "AMRENDRA SINGH",email = "amrendra.singh@soojhai.in"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.0.2)",
    "pytest-cov (==7.0.0)",
    "pylint (==4.0.4)",
    "black (==26.1.0)",
    "isort (==7.0.0)",
    "autoflake (==2.3.1)",
    "pre-commit (==4.5.1)"
]
